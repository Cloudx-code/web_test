<!DOCTYPE html>
<html lang='zh-CN'>
<head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>微博热搜产品创意报告</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f8f9fa;color:#2c3e50;line-height:1.6}.container{max-width:960px;margin:0 auto;padding:20px}.header{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;padding:40px 30px;border-radius:16px;margin-bottom:24px;text-align:center}.header h1{font-size:28px;margin-bottom:8px}.header .subtitle{font-size:14px;opacity:.9;margin-bottom:20px}.stats{display:flex;justify-content:center;gap:32px;flex-wrap:wrap}.stat-item{text-align:center}.stat-num{font-size:32px;font-weight:700}.stat-label{font-size:12px;opacity:.85}.nav{background:#fff;padding:14px 20px;border-radius:12px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}.nav-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav-group span{font-size:13px;color:#888;margin-right:4px}.nav-btn{padding:6px 14px;border:1.5px solid #ddd;border-radius:20px;background:#fff;color:#555;font-size:13px;cursor:pointer;transition:all .2s}.nav-btn:hover{border-color:#e74c3c;color:#e74c3c}.nav-btn.active{background:#e74c3c;color:#fff;border-color:#e74c3c}.card{background:#fff;border-radius:14px;padding:28px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:5px solid #bdc3c7;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}.card.tier-excellent{border-left-color:#e74c3c;box-shadow:0 2px 16px rgba(231,76,60,.18)}.card.tier-good{border-left-color:#27ae60}.card.tier-average{border-left-color:#bdc3c7}.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.rank-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}.rank-1{background:linear-gradient(135deg,#f39c12,#e74c3c)}.rank-2{background:linear-gradient(135deg,#e67e22,#d35400)}.rank-3{background:linear-gradient(135deg,#f1c40f,#e67e22)}.rank-other{background:#95a5a6}.card-title-area{flex:1;margin-left:14px}.hotword{font-size:20px;font-weight:700;color:#2c3e50;margin-bottom:4px}.meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.heat{font-size:13px;color:#e74c3c}.hottag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#ffeaa7;color:#d68910}.score-badge{font-size:28px;font-weight:800;text-align:center;flex-shrink:0}.score-badge .tier-icon{font-size:20px;display:block}.score-excellent{color:#e74c3c}.score-good{color:#27ae60}.score-average{color:#95a5a6}.section{margin-bottom:16px}.section-title{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;margin-bottom:6px;letter-spacing:1px}.event-summary{background:#f8f9fa;padding:14px 16px;border-radius:10px;font-size:14px;color:#555;line-height:1.7}.inspiration{background:#fff5f5;padding:14px 16px;border-radius:10px;font-size:14px;color:#c0392b;border:1px solid #fde2e2}.product-name{font-size:22px;font-weight:700;color:#e74c3c;margin-bottom:4px}.product-pitch{font-size:15px;color:#666;margin-bottom:12px;font-style:italic}.features{list-style:none;padding:0}.features li{padding:6px 0 6px 20px;position:relative;font-size:14px}.features li::before{content:'▸';position:absolute;left:0;color:#e74c3c;font-weight:700}.target-users{font-size:14px;color:#555;margin-top:8px}.target-users strong{color:#2c3e50}.score-bars{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}.score-bar-group{flex:1;min-width:120px}.score-bar-label{font-size:12px;color:#888;margin-bottom:4px}.score-bar-track{height:8px;background:#eee;border-radius:4px;overflow:hidden}.score-bar-fill{height:100%;border-radius:4px;width:0;transition:width 1s ease-out}.score-bar-fill.fun{background:linear-gradient(90deg,#e74c3c,#f39c12)}.score-bar-fill.useful{background:linear-gradient(90deg,#27ae60,#2ecc71)}.score-bar-value{font-size:12px;color:#555;margin-top:2px;text-align:right}@media(max-width:640px){.container{padding:12px}.header{padding:28px 18px}.header h1{font-size:22px}.stats{gap:16px}.stat-num{font-size:24px}.card{padding:20px}.hotword{font-size:17px}.nav{flex-direction:column;align-items:flex-start}}</style>
</head><body>
<div class='container'>
  <div class='header'>
    <h1>微博热搜产品创意报告</h1>
    <div class='subtitle'>最近更新时间：2026-03-28 14:00</div>
    <div class='stats'>
      <div class='stat-item'><div class='stat-num'>0</div><div class='stat-label'>分析话题</div></div>
      <div class='stat-item'><div class='stat-num'>0</div><div class='stat-label'>平均分</div></div>
      <div class='stat-item'><div class='stat-num'>0</div><div class='stat-label'>🏆 优秀</div></div>
      <div class='stat-item'><div class='stat-num'>0</div><div class='stat-label'>👍 良好</div></div>
      <div class='stat-item'><div class='stat-num'>0</div><div class='stat-label'>一般</div></div>
    </div>
  </div>

  <div class='nav'>
    <div class='nav-group'><span>排序</span><button class='nav-btn active' data-sort='score'>按评分</button><button class='nav-btn' data-sort='rank'>按热度</button></div>
    <div class='nav-group'><span>筛选</span><button class='nav-btn active' data-filter='all'>全部</button><button class='nav-btn' data-filter='excellent'>🏆 优秀</button><button class='nav-btn' data-filter='good'>👍 良好</button><button class='nav-btn' data-filter='average'>一般</button></div>
  </div>

  <div id='cards'></div>
</div>
<script>
(function(){
  var observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.style.width=e.target.dataset.width+'%';observer.unobserve(e.target);}})},{threshold:.3});
  document.querySelectorAll('.score-bar-fill').forEach(function(el){observer.observe(el);});
  var cards=document.getElementById('cards');
  var allCards=Array.from(cards.querySelectorAll('.card'));
  document.querySelectorAll('[data-sort]').forEach(function(b){
    b.addEventListener('click',function(){
      this.parentNode.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active')});
      this.classList.add('active');
      var type=this.dataset.sort;
      allCards.slice().sort(function(a,b){
        if(type==='score') return parseInt(b.dataset.score)-parseInt(a.dataset.score);
        return parseInt(a.dataset.rank)-parseInt(b.dataset.rank);
      }).forEach(function(c){cards.appendChild(c);});
      applyFilter();
    });
  });
  document.querySelectorAll('[data-filter]').forEach(function(b){
    b.addEventListener('click',function(){
      this.parentNode.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active')});
      this.classList.add('active');
      applyFilter();
    });
  });
  function applyFilter(){
    var f=document.querySelector('[data-filter].active').dataset.filter;
    allCards.forEach(function(c){
      var s=parseInt(c.dataset.score); var show=true;
      if(f==='excellent') show=s>=80;
      else if(f==='good') show=s>=60&&s<80;
      else if(f==='average') show=s<60;
      c.style.display=show?'':'none';
    });
  }
})();
</script>
</body></html>
