<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudx · 图片模块</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(1000px 500px at 20% -10%, #1a2a5c 0%, #0b1020 65%);
      color: #e8ecf8;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    a { color: #a9c0ff; text-decoration: none; }
    h1 { margin: 14px 0 16px; font-size: 28px; }
    .card {
      margin-top: 10px;
      border: 1px solid #2d3a67;
      border-radius: 14px;
      background: #111832;
      padding: 16px;
    }
    img {
      width: 100%;
      max-width: 620px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #2a3868;
    }
    p { color: #a7b2d3; margin-top: 12px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div><a href="/">← 返回主页</a></div>
    <h1>🖼️ 图片模块</h1>
    <div class="card">
      <img src="/avatar.png" alt="用户指定图片" />
      <p>按你的要求：点击主页模块后展示这张图片。</p>
    </div>
  </div>
</body>
</html>
