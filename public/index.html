<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudx · Web Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1020;
      --card: #111832;
      --line: #263154;
      --text: #e8ecf8;
      --sub: #a7b2d3;
      --primary: #5b8cff;
      --primary2: #7a5cff;
    }
    body {
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2a5c 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 44px 20px 56px;
    }
    .title {
      font-size: 34px;
      font-weight: 760;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }
    .desc {
      color: var(--sub);
      font-size: 15px;
      margin-bottom: 26px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, #121a35, #10162d);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .16s ease, border-color .16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3a4d84;
    }
    .card .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card .summary {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }
    .btn {
      margin-top: 16px;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      width: fit-content;
    }
    .coming {
      background: #0d1328;
      border: 1px dashed #2a3868;
      border-radius: 10px;
      color: #8b96bc;
      font-size: 12px;
      padding: 4px 8px;
      width: fit-content;
      margin-top: 14px;
    }
    .footer {
      margin-top: 22px;
      color: #7c88ae;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Cloudx 应用主页</div>
    <div class="desc">这是统一入口，音乐工具只是其中一环。后续你可以继续把下载器、资料库、运营工具等模块加到这里。</div>

    <div class="grid">
      <div class="card">
        <div>
          <div class="name">🎵 音乐工具</div>
          <div class="summary">搜索歌曲、在线播放、下载音频。已接入后端接口，可直接使用。</div>
        </div>
        <a class="btn" href="/music.html">进入音乐工具</a>
      </div>

      <div class="card">
        <div>
          <div class="name">🖼️ 图片模块</div>
          <div class="summary">验证模块：点击后进入页面并展示你指定的图片。</div>
        </div>
        <a class="btn" href="/image-demo.html">进入图片模块</a>
      </div>

      <div class="card">
        <div>
          <div class="name">🔥 微博热搜</div>
          <div class="summary">每 30 分钟更新一版热搜创意分析报告：事件摘要 + 产品想法 + 评分。</div>
        </div>
        <a class="btn" href="/weibo-hot-analysis-report.html">进入热搜报告</a>
      </div>

      <div class="card">
        <div>
          <div class="name">🧩 模块预留 B</div>
          <div class="summary">保持统一导航结构，后续每个功能都作为主页菜单中的一个模块。</div>
        </div>
        <div class="coming">Coming Soon</div>
      </div>
    </div>

    <div class="footer">v1 · menu-first 信息架构</div>
  </div>
</body>
</html>
